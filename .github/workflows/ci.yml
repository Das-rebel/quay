name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Seed database
        run: bun run scripts/seed.ts

      - name: Start API server
        run: bun run src/server/index.ts &
        env:
          QUAY_API_KEY: quay-dev-key

      - name: Run test suite
        run: |
          # Run unit tests always
          bun test src/lib/__tests__/
          bun test tests/integration/marketing-api.test.ts
          # Run Marketic integration tests only if API keys are configured
          if [ -n "${{ secrets.MARKETIC_API_KEY }}" ]; then
            bun test tests/integration/marketic-integration.test.ts
          else
            echo "Skipping Marketic integration tests (MARKETIC_API_KEY not set in CI)"
          fi

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: npm run build
